<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: warm off-white -->
  <rect width="64" height="64" rx="14" fill="#faf8f5"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#111111" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Viewfinder corners in crisp black -->
  <path d="M 8 16 L 8 8 L 16 8" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 56 16 L 56 8 L 48 8" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 8 48 L 8 56 L 16 56" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 56 48 L 56 56 L 48 56" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round"/>

  <!-- EC Monogram in deep carbon black -->
  <text x="32" y="39" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="22" 
        font-weight="900" 
        letter-spacing="0.05em" 
        fill="#111111">EC</text>
</svg>
